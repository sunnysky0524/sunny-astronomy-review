<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny Astronomy Review｜期中 Ch1～Ch6</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#06101e;color:#eef6ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.top{text-align:center;padding:18px 12px 12px;background:radial-gradient(circle at top,#244f80,#0b1a2d 58%,#06101e)}.top h1{margin:3px;font-size:clamp(27px,5vw,42px)}.top p{margin:6px;color:#afc3da}.scope{display:inline-block;padding:5px 12px;border:1px solid #426b98;border-radius:99px;color:#d4ebff}.tabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:11px;background:#07111f;border-bottom:1px solid #294766;position:sticky;top:0;z-index:5}.tabs button{padding:9px 13px;border-radius:99px;border:1px solid #294766;background:#10213a;color:white;cursor:pointer}.tabs button.active,.tabs button:hover{background:#245080;border-color:#6b9bc8}.view{display:none;width:100%;height:calc(100vh - 174px);min-height:620px;border:0;background:#06101e}.view.active{display:block}@media(max-width:700px){.top{padding-top:12px}.top p{font-size:13px}.view{height:calc(100vh - 205px)}.tabs button{font-size:12px;padding:8px 10px}}</style></head><body><header class="top"><div style="font-size:30px">🪐</div><h1>Sunny Astronomy Review</h1><p>國立空中大學《探索宇宙之美》期中複習網站</p><span class="scope">期中範圍：Ch1～Ch6</span></header><nav class="tabs"><button class="active" data-id="review">📚 完整複習</button><button data-id="visual">🌌 圖解複習</button><button data-id="handout">📘 講義章末題</button><button data-id="mock">📝 期中模擬考</button></nav><iframe id="review" class="view active" src="study.html" title="完整複習"></iframe><iframe id="visual" class="view" data-src="visual-guide.html" title="圖解複習"></iframe><iframe id="handout" class="view" data-src="handout.html" title="講義章末題"></iframe><iframe id="mock" class="view" data-src="mock-exam.html" title="期中模擬考"></iframe><script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=document.getElementById(b.dataset.id);if(!v.getAttribute('src'))v.setAttribute('src',v.dataset.src);v.classList.add('active')});</script></body></html>
