<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講義章末練習｜探索宇宙之美</title><style>:root{--b:#07111f;--c:#0f2037;--l:#294563;--t:#eef6ff;--m:#9db0c8;--a:#8ec5ff;--g:#ffd98a;--o:#8fe3b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17345e,#07111f 42%,#040912);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.w{max-width:1100px;margin:auto;padding:28px 18px 70px}header{text-align:center;padding:28px 0}h1{font-size:clamp(30px,5vw,50px);margin:8px}.sub,.muted{color:var(--m)}.nav,.chs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px}.btn{border:1px solid var(--l);background:#10213a;color:var(--t);padding:10px 15px;border-radius:999px;cursor:pointer;text-decoration:none}.btn.on,.btn:hover{background:#1a3960}.card{background:rgba(15,32,55,.95);border:1px solid var(--l);border-radius:18px;padding:20px;margin:14px 0}.q{border-bottom:1px solid #203955;padding:14px 0;line-height:1.7}.ans{color:var(--o);font-weight:700}.warn{border-left:4px solid var(--g);background:#10213a;padding:12px 15px;border-radius:10px}.count{color:var(--a);font-size:28px;font-weight:800}.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.key{background:#0a1728;border:1px solid var(--l);border-radius:14px;padding:15px}.key strong{color:var(--g)}footer{text-align:center;color:var(--m);padding:25px}</style></head><body><div class="w"><header><div style="font-size:38px">📘🌌</div><h1>講義章末練習中心</h1><div class="sub">《探索宇宙之美》期中 Ch1～Ch6｜依 2026 課程參考講義整理</div><div class="nav"><a class="btn" href="./study.html">← 回完整複習版</a><a class="btn" href="./index.html">平台 47 題</a></div></header><div class="card"><div class="count">Ch1～Ch6</div><p>這一區和「平台 47 題」分開：這裡專門放老師講義每章最後的練習題與講義答案表。</p><div class="warn">⚠️ 講義最後的「練習題解答」頁面直接從第四章跳到第六章，沒有列出第五章答案。因此第五章題目可以複習，但本站不會假裝講義有提供答案。</div></div><div class="chs" id="chs"></div><main id="box"></main></div><footer>Sunny Astronomy Review · Handout Practice</footer><script>const data={1:{tf:['太陽沿黃道的位置變化可用24節氣來描述。','根據目前科學研究，人類能觀察到宇宙中100%的物質。','拉尼亞凱亞超星系團包含銀河系以及許多鄰近星系團。','GPS衛星上的時鐘完全不受速度與地球引力影響，因此不需要相對論修正。'],tfa:['○','×','○','×'],mc:['哈伯的觀測如何支持宇宙正在膨脹？','古代人如何透過觀察北斗七星判斷季節？','火星逆行運動的主要原因？','哪種成像技術與天文X射線觀測原理相似？','CCD與傳統底片相比最大優勢？','宇宙起源於約多久以前的大爆炸？','遙遠星系普遍遠離地球是哪項證據？','地球是太陽系第三顆行星，「第三」從哪裡算起？','古代用哪個天體盈虧制定陰曆？','北斗斗柄西指主要判斷什麼？','最早提出早期日心觀點的古希臘學者？','哥白尼日心說能合理解釋哪種行星現象？','宇宙住址由大到小正確排列？','拉尼亞凱亞超星系團何者正確？','哪個星系屬於本銀河星系群？','伽利略用望遠鏡觀察到哪些天象？（複選）','天文技術推動哪些現代科技？（複選）','無線電波望遠鏡技術應用在哪項生活科技？','X射線天文觀測促進哪項醫學成像？','宇宙星星數量較接近哪個估計？'],mca:['3','3','2','1','3','2','3','1','2','3','4','4','3','3','4','1、2、4','1、2、3','2','3','2']},2:{tf:['日食只可能發生在朔前後，月食只可能發生在望前後。','觀察日、月食都可以用眼睛直視，不需要保護設備。','日全食的貝里珠與崎嶇月球邊緣地形有關。','觀賞日食時可以戴普通太陽眼鏡觀察。'],tfa:['○','×','○','×'],mc:['日食發生時哪個天體位於中間？','月食發生時哪個天體位於中間？','哥倫布利用哪個天文現象嚇阻原住民？','月全食時月亮會出現何種顏色？','月偏食三個主要時刻？','古代發現日食會出現在哪個日子附近？','為什麼初一與十五不是每次都有日月食？','講義圖片題：判斷是哪一種食。','月全食月亮變紅的原因？','沙羅周期是哪個古文明發現？','月食一定發生在滿月前後的原因？','日食觀測哪種方法絕對不安全？','月全食有哪些觀察特徵？（複選）','日全食最後／第一道強光現象叫什麼？','貝里珠形成原因？'],mca:['3','1','3','2','1','3','2','2','3','2','3','2','2、3、4','2','4']},3:{tf:['凌日是行星從它的太陽前方經過。','廣義相對論預測光會受重力場影響而彎曲。','適居帶是行星表面剛好能形成固態水冰的區域。'],tfa:['○','○','×'],mc:['哪個行星無法由天然衛星造成日食？','從木星可觀察哪兩個行星凌日？','凌日法觀測到什麼可判定行星存在？','尋找系外行星主要目的？','Proxima-b 是什麼天體？','哪些太陽系天體有天然衛星，可能發生衛星遮日？（複選）','哪些行星可觀賞其他行星凌日？（複選）','火星上可看到日食是因為？','地球能看到壯觀日全食是因為？','地球可觀察哪些行星凌日？','金星凌日是指？','日全食觀測主要檢驗愛因斯坦哪項理論？','為什麼發明日冕儀？','日冕儀主要功能？','目前找系外行星最有效的方法？','早期首次確認會凌日的重要系外行星案例？','凌日時星光變暗原因？','尋找系外行星的原因？','適居帶主要考慮什麼？','最靠近地球的系外行星？'],mca:['3','1','3','3','3','1、2、4','2、3、4','1','4','2','3','4','1','4','3','4','1','4','4','3']},4:{tf:['太陽內部為核心、輻射層、對流層；外層為光球、色球、日冕。','太陽黑子溫度較低，磁場也比其他地區弱。','KP=9／G5時極光可能出現在中低緯度。'],tfa:['○','×','○'],mc:['可見光下分子雲為何黑暗？','克卜勒、TESS主要任務？','太陽中心溫度約多少？','太陽黑子數量週期？','太空天氣主要能量來源？','太陽還能穩定氫核融合多久？','講義圖片題：太陽上的黑色構造是什麼？','哪位天文學家發現太陽活動與極光關係？','恆星開始核融合條件？','太陽能量來源？','太陽表面溫度約多少？','太陽能量主要來自哪一層？','太陽風暴可能造成哪些影響？（複選）','太陽長期穩定主要是哪兩種作用平衡？','太陽核心主要把哪種元素轉成哪種？','對流層物質如何運動？','不同緯度自轉速度不同稱為？','哪種情況最可能造成強烈地磁暴？','太陽磁場恢復原極性方向約多久？','黑子為何比周圍暗？'],mca:['2','3','2','1','3','2','2','3','1','4','2','3','2、3、4','2','1','1','3','1','3','4']},5:{tf:['彗星由冰與塵構成，因此有「髒雪球」稱呼。','2I/Borisov 是人類發現第一顆具有明顯彗星活動的星際天體。','第谷觀測1577年大彗星後，發現它位於月球軌道之外。','彗星塵埃尾與離子尾一定完全指向相同方向。','1I/Oumuamua、2I/Borisov、3I/ATLAS都來自太陽系之外。'],tfa:null,mc:['Oumuamua 被認為來自哪裡？','彗核反照率通常如何？','流星雨成因？','哪個彗星不曾被太空船造訪？','彗星離子尾通常指向？','哈雷彗星為何以哈雷命名？','哈雷彗星平均多久回到太陽附近？','哪項任務由羅賽塔長期環繞67P並釋放菲萊？','《春秋》「有星孛入於北斗」指什麼？','第谷觀測1577年大彗星得到什麼結論？','活躍彗星主要可見哪些結構？（複選）','Deep Impact 撞擊哪顆彗星？','菲萊無法繼續正常工作的主要原因？','羅賽塔探測目標彗星？','星塵任務主要特色？','哈雷艦隊ESA探測器名稱？','Comet Interceptor 最大特色？','哪些屬於星際天體？（複選）','彗星接近太陽產生彗髮原因？','Stardust 發現甘胺酸的重要意義？'],mca:null},6:{tf:['觀測流星雨最好選擇滿月之夜以增加亮度。','流星的光是因為摩擦空氣產生火焰。','流星體進入大氣發光稱流星；碎片落地稱隕石。','流星雨流星大致平行進入大氣，因透視看似從輻射點散開。'],tfa:['×','×','○','○'],mc:['「星隕如雨」對應哪個天文現象？','ZHR描述哪種數值？','雙子座流星雨母體？','1833年壯觀流星暴是哪個流星雨？','哪項最有利觀賞流星雨？','獅子座流星雨為何以獅子座命名？','Wednesday詞源與哪位神有關？','哪件北歐神話物品曾被聯想為天空亮光？','流星體是指什麼？','流星體高速進大氣為何形成明亮光跡？','流星雨名稱根據什麼？','哪個ZHR代表理論活動最強？','最佳流星雨觀測地點條件？','為何先暗適應20～30分鐘？','為何不建議高倍率望遠鏡？','為何午夜後到清晨較容易觀測？','何者稱火流星？','ZHR=100最正確解釋？','雙子座流星雨較特別原因？','輻射點是什麼？'],mca:['3','2','4','3','2','1','3','2','1','4','4','4','3','1','2','4','1','2','3','3']}};let ch=1;function render(){document.querySelectorAll('.ch').forEach(b=>b.classList.toggle('on',+b.dataset.ch===ch));let d=data[ch],h=`<div class="card"><h2>Ch${ch}｜講義章末練習</h2><h3>一、是非題</h3>`;d.tf.forEach((x,i)=>h+=`<div class="q"><b>${i+1}.</b> ${x} ${d.tfa?`<div class="ans">講義答案：${d.tfa[i]}</div>`:'<div class="muted">講義答案頁未列第五章</div>'}</div>`);h+=`<h3>二、選擇題</h3>`;d.mc.forEach((x,i)=>h+=`<div class="q"><b>${i+1}.</b> ${x} ${d.mca?`<div class="ans">講義答案：${d.mca[i]}</div>`:'<div class="muted">講義答案頁未列第五章</div>'}</div>`);h+='</div>';document.getElementById('box').innerHTML=h}for(let i=1;i<=6;i++)document.getElementById('chs').insertAdjacentHTML('beforeend',`<button class="btn ch" data-ch="${i}">Ch${i}</button>`);document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{ch=+b.dataset.ch;render()});render()</script></body></html>
