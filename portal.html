<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny Astronomy Review</title><style>*{box-sizing:border-box}body{margin:0;background:#06101e;color:#eef6ff;font-family:system-ui}.top{text-align:center;padding:20px;background:linear-gradient(#17365f,#06101e)}h1{margin:5px}.top p{color:#a9bad0}.tabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:12px;background:#07111f;position:sticky;top:0}button{padding:9px 13px;border-radius:99px;border:1px solid #294766;background:#10213a;color:white;cursor:pointer}button.active{background:#245080}.view{display:none;width:100%;height:calc(100vh - 185px);border:0}.view.active{display:block}</style></head><body><div class="top"><div style="font-size:30px">🪐</div><h1>Sunny Astronomy Review</h1><p>《探索宇宙之美》期中 Ch1～Ch6｜所有複習功能整合版</p></div><nav class="tabs"><button class="active" data-id="a">📚 完整複習</button><button data-id="b">🌌 SVG 圖解</button><button data-id="c">📘 講義章末題</button><button data-id="d">📝 期中模擬考</button></nav><iframe id="a" class="view active" src="study.html"></iframe><iframe id="b" class="view" data-src="visual-guide.html"></iframe><iframe id="c" class="view" data-src="handout.html"></iframe><iframe id="d" class="view" data-src="mock-exam.html"></iframe><script>document.querySelectorAll('button').forEach(x=>x.onclick=()=>{document.querySelectorAll('button').forEach(y=>y.classList.remove('active'));document.querySelectorAll('.view').forEach(y=>y.classList.remove('active'));x.classList.add('active');let v=document.getElementById(x.dataset.id);if(!v.src)v.src=v.dataset.src;v.classList.add('active')})</script></body></html>
